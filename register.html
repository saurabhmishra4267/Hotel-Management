<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Grandé Hotel</title>
  <meta name="description" content="Create your Grandé Hotel account to book rooms." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== Navigation ===== -->
  <header id="site-navbar" class="navbar"></header>

  <!-- ===== Register Form ===== -->
  <section style="padding-top:7rem">
    <div class="container">
      <div class="section-head">
        <p class="section-eyebrow">Create Account</p>
        <h1>Register</h1>
      </div>

      <form id="register-form" class="form-card animate-fade-up" novalidate>
        <div class="form-row">
          <div class="field">
            <label for="reg-name">Full Name</label>
            <input type="text" id="reg-name" name="name" placeholder="John Doe" />
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" name="email" placeholder="john@example.com" autocomplete="email" />
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" name="password" placeholder="••••••••" autocomplete="new-password" />
          </div>
        </div>

        <!-- Message area for errors / success -->
        <div id="register-msg" class="error" style="margin-bottom:1rem;text-align:center"></div>

        <button type="submit" class="btn btn-primary btn-lg btn-block">Create Account</button>
        <p style="text-align:center;margin-top:1rem;font-size:.9rem">
          Already have an account? <a href="login.html">Login here</a>
        </p>
      </form>
    </div>
  </section>

  <footer class="footer" style="margin-top:4rem">
    <div class="container">
      <div class="footer-bottom">© 2025 Grandé Hotel. All rights reserved.</div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
